                      <div style={{ fontSize: 13, fontWeight: 600, color: "#4a7c59", textAlign: "right" }}>{fmtD(item.costPerFt)}</div>
                      <div style={{ fontSize: 13, fontWeight: 600, color: "#C4956A", textAlign: "right" }}>{fmtD(item.sellPerFt)}</div>
                      <div style={{ fontSize: 13, fontWeight: 600, color: "#8B5E3C", textAlign: "right" }}>{fmtD(item.jkPerFt)}</div>
                    </div>
                  ))}
                </div>
              </div>
            ))}

            {/* Quote-based linear foot breakdown */}
            {quotes.map(q => {
              if (!q.items.length) return null;
              const qTier = (f) => finishTier(f);
              const upperItems = q.items.filter(i => isUpper(i));
              const lowerItems = q.items.filter(i => isLower(i));
              const tallItems  = q.items.filter(i => isTall(i));
              const calcLft = (items) => items.reduce((s, i) => s + (getWidth(i.description) / 12) * i.qty, 0);
              const calcSell = (items) => items.reduce((s, i) => s + i.price * i.qty, 0);
              const upperLft = calcLft(upperItems), lowerLft = calcLft(lowerItems), tallLft = calcLft(tallItems);
              const upperSell = calcSell(upperItems), lowerSell = calcSell(lowerItems), tallSell = calcSell(tallItems);
              const totalLft = upperLft + lowerLft + tallLft;
              const totalSellQ = upperSell + lowerSell + tallSell;
              if (totalLft === 0) return null;
              return (
                <div key={q.id} style={{ background: "#fff", borderRadius: 14, border: "1px solid #E5DFD6", overflow: "hidden", marginBottom: 12 }}>
                  <div style={{ background: "#F5F2ED", padding: "10px 16px", borderBottom: "1px solid #E5DFD6", display: "flex", justifyContent: "space-between" }}>
                    <div style={{ fontSize: 12, fontWeight: 600 }}>{q.name}</div>
                    <div style={{ fontSize: 10, opacity: 0.5 }}>{totalLft.toFixed(1)} total linear feet</div>
                  </div>
                  <div style={{ padding: "14px 16px" }}>
                    {[
                      { label: "Upper / Wall", lft: upperLft, sell: upperSell, color: sectionColor.upper },
                      { label: "Lower / Base", lft: lowerLft, sell: lowerSell, color: sectionColor.lower },
                      { label: "Tall / Pantry", lft: tallLft,  sell: tallSell,  color: sectionColor.tall  },
                    ].filter(r => r.lft > 0).map(({ label, lft, sell, color }) => (
                      <div key={label} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, padding: "10px 12px", background: "#FAFAF8", borderRadius: 8, border: "1px solid #EDE9E2" }}>
                        <div>
                          <div style={{ fontSize: 12, fontWeight: 600, color }}>{label}</div>
                          <div style={{ fontSize: 11, opacity: 0.5, marginTop: 2 }}>{lft.toFixed(1)} linear feet</div>
                        </div>
                        <div style={{ textAlign: "right" }}>
                          <div style={{ fontSize: 15, fontWeight: 700, color }}>{fmt(sell)}</div>
                          <div style={{ fontSize: 10, opacity: 0.5, marginTop: 1 }}>{fmtD(lft > 0 ? sell/lft : null)}/ft avg</div>
                        </div>
                      </div>
                    ))}
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#1a1a1a", borderRadius: 10, padding: "12px 14px", color: "#F5F2ED" }}>
                      <div>
                        <div style={{ fontSize: 12, color: "#C4956A", fontWeight: 600 }}>Total — {totalLft.toFixed(1)} lin ft</div>
                        <div style={{ fontSize: 10, opacity: 0.4, marginTop: 2 }}>{fmtD(totalLft > 0 ? totalSellQ/totalLft : null)}/ft blended avg</div>
                      </div>
                      <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 26, color: "#C4956A" }}>{fmt(totalSellQ)}</div>
                    </div>
                  </div>
                </div>
              );
            })}

            {/* Reference Projects */}
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontSize: 10, letterSpacing: 2, opacity: 0.4, marginBottom: 10 }}>REFERENCE PROJECTS</div>
              {REFERENCE_PROJECTS.map((proj, pi) => {
                const projItems = proj.items.map(({ sku, qty }) => {
                  const cat = cabinets.find(c => c.id === sku);
                  return cat ? { ...cat, qty } : null;
                }).filter(Boolean);
                const projRetail = projItems.reduce((s, c) => s + c.tier1 * c.qty, 0);
                const supplierTotal = proj.supplierUnitPrices
                  ? proj.items.reduce((s, { sku, qty }) => s + (proj.supplierUnitPrices[sku] || 0) * qty, 0)
                  : null;
                const projUpperLft = projItems.filter(c => isUpper(c)).reduce((s,c)=>{
                  const wM = (c.description||"").match(/(\d+)["x]/); const w = wM ? parseInt(wM[1]) : 0;
                  return s + (w/12)*c.qty;
                }, 0);
                const projLowerLft = projItems.filter(c => isLower(c)).reduce((s,c)=>{
                  const wM = (c.description||"").match(/(\d+)["x]/); const w = wM ? parseInt(wM[1]) : 0;
                  return s + (w/12)*c.qty;
                }, 0);
                const totalLft = projUpperLft + projLowerLft;
                const sellPerLft = totalLft > 0 ? Math.round(proj.salePrice / totalLft) : 0;
                return (
                  <div key={pi} style={{ background: "#fff", borderRadius: 14, border: "1.5px solid #D4B8E8", overflow: "hidden", marginBottom: 10 }}>
                    <div style={{ background: "#F5F0FA", padding: "12px 16px", borderBottom: "1px solid #D4B8E8", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <div>
                        <div style={{ fontSize: 13, fontWeight: 700, color: "#7B4F9E" }}>{proj.name}</div>
                        <div style={{ fontSize: 10, opacity: 0.5, marginTop: 2 }}>{proj.finish} · {proj.notes}</div>
                      </div>
                      <div style={{ textAlign: "right" }}>
                        <div style={{ fontSize: 9, opacity: 0.4, letterSpacing: 1 }}>SOLD FOR</div>
                        <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 22, color: "#7B4F9E" }}>{fmt(proj.salePrice)}</div>
                      </div>
                    </div>
                    <div style={{ padding: "14px 16px" }}>
                      {/* Linear foot stats */}
                      <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
                        {[
                          ["Upper", projUpperLft.toFixed(1) + " ft"],
                          ["Lower", projLowerLft.toFixed(1) + " ft"],
                          ["Total", totalLft.toFixed(1) + " ft"],
                          ["$/Lin Ft", fmt(sellPerLft)],
                        ].map(([l, v]) => (
                          <div key={l} style={{ flex: 1, background: "#F5F2ED", borderRadius: 8, padding: "8px 10px" }}>
                            <div style={{ fontSize: 8, opacity: 0.4, letterSpacing: 1, marginBottom: 3 }}>{l.toUpperCase()}</div>
                            <div style={{ fontSize: 13, fontWeight: 700 }}>{v}</div>
                          </div>
                        ))}
                      </div>
                      {/* Price benchmarks */}
                      <div style={{ display: "flex", gap: 8, marginBottom: supplierTotal ? 10 : 0 }}>
                        {[
                          ["T1 Retail Ref", fmt(projRetail), "#aaa"],
                          ["Sale Price", fmt(proj.salePrice), "#7B4F9E"],
                          ["Multiplier", (proj.salePrice / projRetail).toFixed(2) + "×", "#C4956A"],
                          ["Cabinets", proj.items.reduce((s,i)=>s+i.qty,0), "#1a1a1a"],
                        ].map(([l, v, col]) => (
                          <div key={l} style={{ flex: 1, background: "#FAFAF8", borderRadius: 8, padding: "8px 10px", border: "1px solid #EDE9E2" }}>
                            <div style={{ fontSize: 8, opacity: 0.4, letterSpacing: 1, marginBottom: 3 }}>{l.toUpperCase()}</div>
                            <div style={{ fontSize: 13, fontWeight: 700, color: col }}>{v}</div>
                          </div>
                        ))}
                      </div>
                      {/* Supplier cost row (Sherlock only) */}
                      {supplierTotal > 0 && (
                        <div style={{ marginTop: 10, padding: "10px 12px", background: "#F5F0FA", borderRadius: 8, border: "1px solid #D4B8E8", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                          <div>
                            <div style={{ fontSize: 11, color: "#7B4F9E", fontWeight: 600 }}>Supplier "Deluxe" Cost</div>
                            <div style={{ fontSize: 10, opacity: 0.5, marginTop: 2 }}>Unit prices from PDF · ~34% of T1 retail</div>
                          </div>
                          <div style={{ textAlign: "right" }}>
                            <div style={{ fontSize: 18, fontWeight: 700, color: "#7B4F9E" }}>{fmt(supplierTotal)}</div>
                            <div style={{ fontSize: 10, opacity: 0.4, marginTop: 1 }}>
                              Margin: {fmt(proj.salePrice - supplierTotal)} ({Math.round((proj.salePrice - supplierTotal) / proj.salePrice * 100)}%)
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}

              {/* Cross-project average */}
              {REFERENCE_PROJECTS.length > 1 && (() => {
                const avgMultiplier = (REFERENCE_PROJECTS.reduce((s, p) => s + p.impliedMultiplier, 0) / REFERENCE_PROJECTS.length).toFixed(2);
                const avgSale = Math.round(REFERENCE_PROJECTS.reduce((s, p) => s + p.salePrice, 0) / REFERENCE_PROJECTS.length);
                return (
                  <div style={{ background: "#1a1a1a", color: "#F5F2ED", borderRadius: 14, padding: "16px 18px", marginBottom: 10 }}>
                    <div style={{ fontSize: 10, letterSpacing: 2, color: "#7B4F9E", opacity: 0.8, marginBottom: 12 }}>PAINT GRADE BENCHMARKS · {REFERENCE_PROJECTS.length} PROJECTS</div>
                    <div style={{ display: "flex", gap: 10 }}>
                      {[
                        ["Avg Sale", fmt(avgSale)],
                        ["Avg Multiplier", avgMultiplier + "×"],
                        ["Recommended", "2.0×"],
                      ].map(([l, v]) => (
                        <div key={l} style={{ flex: 1, background: "#2a2a2a", borderRadius: 8, padding: "10px 12px" }}>
                          <div style={{ fontSize: 8, opacity: 0.4, letterSpacing: 1, marginBottom: 4 }}>{l.toUpperCase()}</div>
                          <div style={{ fontSize: 16, fontWeight: 700, color: "#C4956A" }}>{v}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })()}
            </div>
          </div>
        );
      })()}

      {/* SCAN / LAYOUT TAB */}
      {tab === "scan" && (() => {

        const handleFileUpload = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          setScanResult(null);
          setScanStatus("idle");
          setScanError(null);

          const isPdf = file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf");
          setScanImageUrl(isPdf ? null : URL.createObjectURL(file));

          const reader = new FileReader();
          reader.onload = (ev) => {
            const b64 = ev.target.result.split(",")[1];
            setScanImage({ b64, isPdf, name: file.name, mediaType: isPdf ? "application/pdf" : file.type || "image/jpeg" });
          };
          reader.readAsDataURL(file);
        };

        const runScan = async () => {
          if (!scanImage) return;
          setScanStatus("scanning");
          setScanError(null);
          setScanResult(null);
          setScanExcluded(new Set());
          try {
            const prompt = `You are analyzing a kitchen cabinet layout drawing, floor plan, elevation, or design document.

Identify ALL cabinets shown and return structured JSON. For each cabinet identify:
1. type: "base" | "wall" | "pantry" | "vanity" | "drawer_base" | "sink_base" | "blind_corner" | "lazy_susan" | "diagonal_corner" | "microwave" | "tall" | "accessory"
2. width in inches (common: 9,12,15,18,21,24,27,30,33,36,42)
3. height in inches for wall cabinets (common: 12,15,18,21,24,30,36,42) — null for base
4. qty (default 1)
5. location label if visible (e.g. "sink wall", "island", "upper left")
6. style_notes if visible (shaker, flat panel, etc.)
7. confidence: "high" | "medium" | "low"
8. description: human-readable label like "30\\" Base Cabinet"

Respond ONLY with valid JSON — no markdown, no backticks, no explanation:
{
  "cabinets": [{"type":"base","width":24,"height":null,"qty":1,"location":"sink run","style_notes":"shaker","confidence":"high","description":"24\\" Base Cabinet"}],
  "layout_notes": "One sentence summary of what was detected",
  "total_upper_lft": 10.5,
  "total_lower_lft": 12.0,
  "rooms_detected": ["kitchen"]
}`;

            // Build content block
            const contentBlock = scanImage.isPdf
              ? { type: "document", source: { type: "base64", media_type: "application/pdf", data: scanImage.b64 } }
              : { type: "image", source: { type: "base64", media_type: scanImage.mediaType || "image/jpeg", data: scanImage.b64 } };

            const headers = { "Content-Type": "application/json" };
            if (scanImage.isPdf) headers["anthropic-beta"] = "pdfs-2024-09-25";

            const resp = await fetch("https://api.anthropic.com/v1/messages", {
              method: "POST",
              headers,
              body: JSON.stringify({
                model: "claude-sonnet-4-20250514",
                max_tokens: 8000,
                messages: [{ role: "user", content: [contentBlock, { type: "text", text: prompt }] }]
              })
            });

            const data = await resp.json();

            // Surface API errors clearly
            if (data.error) throw new Error(`API error ${data.error.type}: ${data.error.message}`);

            const raw = data.content?.find(b => b.type === "text")?.text || "";
            if (!raw) throw new Error("Empty response from API");

            // Extract JSON — handle truncation by salvaging partial cabinet arrays
            let parsed;
            try {
              const jsonMatch = raw.match(/\{[\s\S]*\}/);
              if (!jsonMatch) throw new Error("no json block");
              parsed = JSON.parse(jsonMatch[0]);
            } catch {
              // Response was cut off mid-JSON — try to salvage the cabinets array
              try {
                const arrMatch = raw.match(/"cabinets"\s*:\s*(\[[\s\S]*)/);
                if (!arrMatch) throw new Error("no cabinets array");
                let arrStr = arrMatch[1];
                // Find last complete object by looking for last "},"  or "}"
                const lastComplete = Math.max(arrStr.lastIndexOf("},"), arrStr.lastIndexOf("}\n"));
                if (lastComplete > 0) arrStr = arrStr.slice(0, lastComplete + 1) + "]";
                else arrStr = arrStr.replace(/,?\s*\{[^}]*$/, "]"); // drop incomplete last item
                const cabinets = JSON.parse(arrStr);

                // Estimate lin ft from salvaged cabinets
                const upperFt = cabinets.filter(c => c.type === "wall").reduce((s, c) => s + (c.width || 0) / 12 * (c.qty || 1), 0);
                const lowerFt = cabinets.filter(c => ["base","sink_base","drawer_base","blind_corner","lazy_susan"].includes(c.type)).reduce((s, c) => s + (c.width || 0) / 12 * (c.qty || 1), 0);

                parsed = {
                  cabinets,
                  layout_notes: `Detected ${cabinets.length} cabinets (response was truncated — some items may be missing).`,
                  total_upper_lft: Math.round(upperFt * 10) / 10,
                  total_lower_lft: Math.round(lowerFt * 10) / 10,
                  rooms_detected: ["unknown"],
                  _truncated: true
                };
              } catch {
                throw new Error(`JSON parse failed. The layout may be too complex — try cropping to one room or wall. Raw: ${raw.slice(0, 200)}...`);
              }
            }

            if (!parsed.cabinets || !Array.isArray(parsed.cabinets)) throw new Error("Invalid response structure");

            setScanResult(parsed);
            setScanStatus("done");
          } catch (err) {
            console.error("Scan error:", err);
            setScanError(err.message || "Unknown error. Check console for details.");
            setScanStatus("error");
          }
        };

        // Try to match a scanned cabinet to our catalog
        // Handles SKU format variants: DB24-3 = 3DB24, W3036 = 30x36 wall, etc.
        const matchCatalog = (scanned) => {
          const t = scanned.type;
          const w = scanned.width;
          const h = scanned.height;
          const rawId = (scanned.id || scanned.sku || "").toUpperCase().replace(/\s/g, "");

          // ── 1. Direct SKU match (normalize format variations) ──────
          // Normalize "DB24-3" → "3DB24", "DB30-2" → "2DB30", "WB3036" → "W3036", etc.
          const normalizeSku = (sku) => {
            let s = sku.toUpperCase().replace(/\s/g, "");
            // "DB{W}-{N}" → "{N}DB{W}"  e.g. DB24-3 → 3DB24
            s = s.replace(/^DB(\d+)-(\d+)$/, "$2DB$1");
            // "DB{W}{N}" → "{N}DB{W}"  e.g. DB243 → 3DB24 (less common)
            s = s.replace(/^DB(\d+)(\d)$/, "$2DB$1");
            // Strip leading style codes like "S8/", "E2/", "B8/", "K3/"
            s = s.replace(/^[A-Z]\d\//, "");
            // "WB" prefix cleanup → "W"
            s = s.replace(/^WB(\d)/, "W$1");
            return s;
          };

          if (rawId) {
            const normalized = normalizeSku(rawId);
            // Try exact match on catalog id
            const exactMatch = cabinets.find(c => c.id.toUpperCase() === normalized);
            if (exactMatch) return exactMatch;
            // Try after stripping style prefix from catalog id too
            const partialMatch = cabinets.find(c => normalizeSku(c.id.toUpperCase()) === normalized);
            if (partialMatch) return partialMatch;
          }

          // ── 2. Type + width + height match ──────────────────────────
          // Extract drawer count from description or type (e.g. "3-drawer", "2 drawer")
          const drawerMatch = (scanned.description || "").match(/(\d)\s*-?\s*drawer/i);
          const drawerCount = drawerMatch ? parseInt(drawerMatch[1]) : null;

          const typeMap = {
            base: (c) =>
              c.category === "Base Cabinets" &&
              c.description.includes(`${w}"`) &&
              !c.description.toLowerCase().includes("drawer") &&
              !c.description.toLowerCase().includes("sink") &&
              !c.description.toLowerCase().includes("lazy") &&
              !c.description.toLowerCase().includes("blind"),

            drawer_base: (c) => {
              if (c.category !== "Base Cabinets") return false;
              if (!c.description.includes(`${w}"`)) return false;
              if (!c.description.toLowerCase().includes("drawer")) return false;
              // If we know drawer count, match it
              if (drawerCount) {
                const catDrawers = c.description.match(/(\d)\s*Drawer/i);
                if (catDrawers && parseInt(catDrawers[1]) !== drawerCount) return false;
              }
              return true;
            },

            sink_base: (c) =>
              c.category === "Base Cabinets" &&
              c.description.includes(`${w}"`) &&
              c.description.toLowerCase().includes("sink"),

            wall: (c) => {
              if (c.category !== "Wall Cabinets") return false;
              if (c.description.toLowerCase().includes("glass door only")) return false;
              if (h) return c.description.includes(`${w}x${h}`);
              return c.description.match(new RegExp(`${w}x\\d+(?!x)`)) !== null;
            },

            pantry: (c) =>
              c.category === "Pantry & Oven Cabinets" &&
              c.description.toLowerCase().includes("pantry") &&
              c.description.includes(`${w}x`) &&
              (h ? c.description.includes(`x${h}x`) || c.description.includes(`x${h}`) : true),

            tall: (c) =>
              c.category === "Pantry & Oven Cabinets" &&
              c.description.includes(`${w}x`),

            vanity: (c) => {
              if (c.category !== "Vanity Cabinets") return false;
              if (!c.description.includes(`${w}"`)) return false;
              // drawer_base type → prefer drawer vanity
              if (drawerCount) return c.description.toLowerCase().includes("drawer");
              return true;
            },

            blind_corner: (c) =>
              c.description.toLowerCase().includes("blind corner") &&
              (w ? c.description.includes(`${w}"`) || c.description.includes(`${w}x`) : true),

            lazy_susan: (c) =>
              c.description.toLowerCase().includes("lazy susan") &&
              (w ? c.description.includes(`${w}"`) || c.description.includes(`${w}x`) : true),

            diagonal_corner: (c) =>
              c.description.toLowerCase().includes("diagonal") &&
              (w ? c.description.includes(`${w}x`) : true),

            microwave: (c) =>
              c.description.toLowerCase().includes("microwave") &&
              (w ? c.description.includes(`${w}x`) || c.description.includes(`${w}"`) : true),

            sink_base: (c) =>
              c.category === "Base Cabinets" &&
              (w ? c.description.includes(`${w}"`) : true) &&
              c.description.toLowerCase().includes("sink"),
          };

          const fn = typeMap[t];
          if (fn) {
            const found = cabinets.find(fn);
            if (found) return found;
          }

          // ── 3. Fuzzy fallback — width match within same broad category ──
          const catMap = {
            base: "Base Cabinets", drawer_base: "Base Cabinets", sink_base: "Base Cabinets",
            blind_corner: "Base Cabinets", lazy_susan: "Base Cabinets",
            wall: "Wall Cabinets", microwave: "Wall Cabinets", diagonal_corner: "Wall Cabinets",
            pantry: "Pantry & Oven Cabinets", tall: "Pantry & Oven Cabinets",
            vanity: "Vanity Cabinets",
          };
          const cat = catMap[t];
          if (cat && w) {
            return cabinets.find(c =>
              c.category === cat && c.description.includes(`${w}"`)
            ) || null;
          }

          return null;
        };


        // ── CUBIC FOOT ESTIMATION ENGINE ──────────────────────────
        const CABINET_DIMS = {
          base:            { depth: 24, height: 34.5 },
          drawer_base:     { depth: 24, height: 34.5 },
          sink_base:       { depth: 24, height: 34.5 },
          blind_corner:    { depth: 24, height: 34.5 },
          lazy_susan:      { depth: 24, height: 34.5 },
          wall:            { depth: 12, height: null  },
          microwave:       { depth: 12, height: null  },
          diagonal_corner: { depth: 12, height: null  },
          pantry:          { depth: 24, height: null  },
          tall:            { depth: 24, height: 84    },
          vanity:          { depth: 21, height: 34.5  },
        };

        const getCubicFt = (item) => {
          const dims = CABINET_DIMS[item.type] || CABINET_DIMS.base;
          const w = item.width || 24;
          const d = dims.depth;
          const h = dims.height || item.height || 30;
          return (w * d * h) / 1728;
        };

        // Build $/cubic-ft rate table from known catalog items
        const buildCubicRates = (tier) => {
          const typeGroups = {
            base:        cabinets.filter(c => c.category === "Base Cabinets" && !c.description.toLowerCase().includes("drawer") && !c.description.toLowerCase().includes("sink")),
            drawer_base: cabinets.filter(c => c.category === "Base Cabinets" && c.description.toLowerCase().includes("drawer")),
            sink_base:   cabinets.filter(c => c.category === "Base Cabinets" && c.description.toLowerCase().includes("sink")),
            wall:        cabinets.filter(c => c.category === "Wall Cabinets" && !c.description.toLowerCase().includes("glass door only")),
            pantry:      cabinets.filter(c => c.category === "Pantry & Oven Cabinets"),
            tall:        cabinets.filter(c => c.category === "Pantry & Oven Cabinets"),
            vanity:      cabinets.filter(c => c.category === "Vanity Cabinets"),
          };
          const rates = {};
          Object.entries(typeGroups).forEach(([type, items]) => {
            const dims = CABINET_DIMS[type] || CABINET_DIMS.base;
            const itemRates = items.map(c => {
              const wM = c.description.match(/(\d+)["x]/);
              const w = wM ? parseInt(wM[1]) : 24;
              const hM = c.description.match(/\d+x(\d+)/);
              const h = dims.height || (hM ? parseInt(hM[1]) : 30);
              const cf = (w * dims.depth * h) / 1728;
              return cf > 0 ? c[tier] / cf : null;
            }).filter(Boolean);
            if (itemRates.length) rates[type] = itemRates.reduce((a, b) => a + b, 0) / itemRates.length;
          });
          const allRates = cabinets.map(c => {
            const wM = c.description.match(/(\d+)["x]/); const w = wM ? parseInt(wM[1]) : 24;
            const cf = (w * 18 * 30) / 1728;
            return cf > 0 ? c[tier] / cf : null;
          }).filter(Boolean);
          rates._overall = allRates.reduce((a, b) => a + b, 0) / allRates.length;
          return rates;
        };

        const cubicRates = buildCubicRates(finishTier(scanFinish));

        const estimatePrice = (scanned) => {
          const cf = getCubicFt(scanned);
          const rate = cubicRates[scanned.type] || cubicRates.base || cubicRates._overall;
          if (!rate || cf === 0) return null;
          const retail = Math.round(cf * rate);
          return {
            retail,
            cost: Math.round(retail * MFC_COST_MULT),
            sell: Math.round(retail * 0.35 * JK_SELL_MULT),
            cf: Math.round(cf * 100) / 100,
            ratePerCf: Math.round(rate),
          };
        };

        const toggleExclude = (i) => {
          setScanExcluded(prev => {
            const next = new Set(prev);
            if (next.has(i)) next.delete(i); else next.add(i);
            return next;
          });
        };

        const addAllToQuote = () => {
          if (!scanResult?.cabinets) return;
          const tier = finishTier(scanFinish);
          scanResult.cabinets.forEach((scanned, i) => {
            if (scanExcluded.has(i)) return;
            const match = matchCatalog(scanned);
            if (!match) return;
            const price = match[tier];
            const qty = scanned.qty || 1;
            setCart(prev => {
              const existing = prev.find(c => c.id === match.id && c.finish === scanFinish);
              if (existing) return prev.map(c => c.id === match.id && c.finish === scanFinish ? { ...c, qty: c.qty + qty } : c);
              return [...prev, { ...match, finish: scanFinish, price, qty }];
            });
          });
          // Clear scan state and go to quote to edit
          setScanResult(null);
          setScanStatus("idle");
          setScanImage(null);
          setScanImageUrl(null);
          setScanExcluded(new Set());
          setTab("quote");
        };

        const confidenceColor = { high: "#4a7c59", medium: "#C4956A", low: "#c0392b" };
        const typeIcon = { base: "🟫", wall: "🔲", pantry: "📦", tall: "📦", drawer_base: "🗄", sink_base: "🚰", blind_corner: "↩️", lazy_susan: "🔄", diagonal_corner: "◣", microwave: "📡", vanity: "🪞", accessory: "⚙️" };

        return (
          <div style={{ padding: "16px 14px 32px" }}>
            <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 22, marginBottom: 4 }}>Layout Scanner</div>
            <div style={{ fontSize: 11, opacity: 0.45, marginBottom: 18 }}>Upload a floor plan, elevation drawing, or cabinet layout — AI will detect cabinet sizes and types.</div>

            {/* Upload area */}
            <label style={{
              display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
              border: `2px dashed ${scanImage ? "#4a7c59" : "#D4CBB8"}`,
              borderRadius: 14, padding: "24px 16px", cursor: "pointer",
              background: scanImage ? "#F0F7F2" : "#fff", marginBottom: 14,
              transition: "all 0.2s"
            }}>
              <input type="file" accept="image/*,.pdf,application/pdf" onChange={handleFileUpload} style={{ display: "none" }} />
              {scanImage && scanImage.isPdf ? (
                <div style={{ width: "100%", textAlign: "center" }}>
                  <div style={{ fontSize: 52, marginBottom: 8 }}>📄</div>
                  <div style={{ fontSize: 13, fontWeight: 500, color: "#4a7c59" }}>✓ {scanImage.name}</div>
                  <div style={{ fontSize: 11, opacity: 0.4, marginTop: 4 }}>PDF loaded — tap to change</div>
                </div>
              ) : scanImageUrl ? (
                <div style={{ width: "100%", textAlign: "center" }}>
                  <img src={scanImageUrl} alt="layout" style={{ maxWidth: "100%", maxHeight: 280, borderRadius: 8, objectFit: "contain" }} />
                  <div style={{ fontSize: 11, color: "#4a7c59", marginTop: 10 }}>✓ Image loaded — tap to change</div>
                </div>
              ) : (
                <>
                  <div style={{ fontSize: 40, marginBottom: 10 }}>📐</div>
                  <div style={{ fontSize: 14, fontWeight: 500, color: "#1a1a1a", marginBottom: 4 }}>Upload Layout</div>
                  <div style={{ fontSize: 11, opacity: 0.4, textAlign: "center" }}>Floor plan · Elevation drawing · Cabinet schedule</div>
                  <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                    {["JPG", "PNG", "PDF"].map(t => (
                      <span key={t} style={{ fontSize: 10, padding: "3px 8px", background: "#F5F2ED", borderRadius: 6, color: "#8B7355", fontWeight: 600 }}>{t}</span>
                    ))}
                  </div>
                </>
              )}
            </label>

            {/* Finish to apply */}
            {scanImage?.b64 && (
              <div style={{ marginBottom: 14 }}>
                <div style={{ fontSize: 10, letterSpacing: 2, opacity: 0.4, marginBottom: 8 }}>APPLY FINISH TO DETECTED CABINETS</div>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                  {[...TIER_ONE_FINISHES, ...TIER_TWO_FINISHES].map(f => (
                    <button key={f} onClick={() => setScanFinish(f)} style={{
                      padding: "6px 12px", border: `1.5px solid ${scanFinish === f ? "#1a1a1a" : "#D4CBB8"}`,
                      background: scanFinish === f ? "#1a1a1a" : "transparent",
                      color: scanFinish === f ? "#F5F2ED" : "#666",
                      borderRadius: 16, fontSize: 11, cursor: "pointer", fontFamily: "inherit"
                    }}>{f}</button>
                  ))}
                </div>
              </div>
            )}

            {/* Scan button */}
            {scanImage?.b64 && scanStatus !== "scanning" && (
              <button onClick={runScan} style={{
                width: "100%", padding: "14px", background: "#1a1a1a", color: "#F5F2ED",
                border: "none", borderRadius: 12, fontSize: 14, fontWeight: 600,
                cursor: "pointer", marginBottom: 16, fontFamily: "inherit",
                display: "flex", alignItems: "center", justifyContent: "center", gap: 8
              }}>
                🔍 Analyze Layout
              </button>
            )}

            {/* Scanning state */}
            {scanStatus === "scanning" && (
              <div style={{ background: "#fff", borderRadius: 12, border: "1px solid #E5DFD6", padding: "24px", textAlign: "center", marginBottom: 16 }}>
                <div style={{ fontSize: 32, marginBottom: 10, animation: "spin 1.5s linear infinite", display: "inline-block" }}>🔍</div>
                <div style={{ fontSize: 14, fontWeight: 500 }}>Analyzing layout...</div>
                <div style={{ fontSize: 11, opacity: 0.4, marginTop: 6 }}>Reading cabinet dimensions and types</div>
                <style>{`@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }`}</style>
              </div>
            )}

            {/* Error */}
            {scanStatus === "error" && (
              <div style={{ background: "#FEF0F0", borderRadius: 12, border: "1px solid #F0C0C0", padding: "16px", marginBottom: 16 }}>
                <div style={{ fontSize: 13, color: "#c0392b", fontWeight: 500, marginBottom: 6 }}>⚠ Detection issue</div>
                <div style={{ fontSize: 12, color: "#c0392b", opacity: 0.85, marginBottom: 10, fontFamily: "monospace", background: "#fff5f5", padding: "8px 10px", borderRadius: 6, wordBreak: "break-word" }}>{scanError}</div>
                <div style={{ fontSize: 11, opacity: 0.6 }}>
                  Tips: Ensure the image is clear and not rotated. PDFs with text layers work best. 
                  For drawings, label cabinets with dimensions (e.g. "B24", "W3036") for better results.
                </div>
                <button onClick={runScan} style={{
                  marginTop: 10, width: "100%", padding: "10px", background: "#1a1a1a", color: "#F5F2ED",
                  border: "none", borderRadius: 8, fontSize: 12, cursor: "pointer", fontFamily: "inherit"
                }}>↺ Try Again</button>
              </div>
            )}

            {/* Results */}
            {scanStatus === "done" && scanResult && (
              <>
                {/* Truncation warning */}
                {scanResult._truncated && (
                  <div style={{ background: "#FEF3EB", border: "1px solid #F0C89A", borderRadius: 10, padding: "10px 14px", marginBottom: 12, fontSize: 11, color: "#8B5E3C" }}>
                    ⚠ Response was truncated — some cabinets may be missing. Results shown are partial. Try uploading a cropped section of the layout for complete detection.
                  </div>
                )}

                {/* Summary */}
                <div style={{ background: "#1a1a1a", color: "#F5F2ED", borderRadius: 14, padding: "16px 18px", marginBottom: 14 }}>
                  <div style={{ fontSize: 10, letterSpacing: 2, opacity: 0.4, marginBottom: 10 }}>LAYOUT DETECTED</div>
                  <div style={{ fontSize: 13, lineHeight: 1.6, marginBottom: 12 }}>{scanResult.layout_notes}</div>
                  <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                    {[
                      { label: "Cabinets Found", val: scanResult.cabinets?.length || 0 },
                      { label: "Upper Lin Ft", val: scanResult.total_upper_lft ? `${scanResult.total_upper_lft.toFixed(1)}'` : "—" },
                      { label: "Lower Lin Ft", val: scanResult.total_lower_lft ? `${scanResult.total_lower_lft.toFixed(1)}'` : "—" },
                    ].map(({ label, val }) => (
                      <div key={label} style={{ flex: 1, minWidth: 80, background: "#2a2a2a", borderRadius: 8, padding: "8px 10px" }}>
                        <div style={{ fontSize: 9, opacity: 0.4, letterSpacing: 1, marginBottom: 3 }}>{label.toUpperCase()}</div>
                        <div style={{ fontSize: 18, fontWeight: 700, color: "#C4956A" }}>{val}</div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Detected cabinets list */}
                <div style={{ marginBottom: 14 }}>
                  <div style={{ fontSize: 10, letterSpacing: 2, opacity: 0.4, marginBottom: 10 }}>DETECTED CABINETS</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {scanResult.cabinets?.map((scanned, i) => {
                      const match = matchCatalog(scanned);
                      const tier = finishTier(scanFinish);
                      const est = !match ? estimatePrice(scanned) : null;
                      const excluded = scanExcluded.has(i);
                      return (
                        <div key={i} style={{
                          background: excluded ? "#F5F5F5" : "#fff",
                          borderRadius: 10,
                          border: `1px solid ${excluded ? "#E0E0E0" : match ? "#C8E6D0" : est ? "#D4CBB8" : "#F0C0C0"}`,
                          overflow: "hidden",
                          opacity: excluded ? 0.5 : 1,
                          transition: "opacity 0.2s"
                        }}>
                          <div style={{ display: "flex", gap: 10, padding: "12px 14px", alignItems: "flex-start" }}>
                            {match ? (
                              <div style={{ flexShrink: 0, background: "#F5F2ED", borderRadius: 7, padding: "6px", display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden" }}>
                                <CabinetIcon id={match.id} description={match.description} finish={scanFinish} />
                              </div>
                            ) : (
                              <div style={{ flexShrink: 0, width: 52, height: 52, background: est ? "#F5F2ED" : "#FEF3EB", borderRadius: 7, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22 }}>
                                {typeIcon[scanned.type] || "📦"}
                              </div>
                            )}
                            <div style={{ flex: 1 }}>
                              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                                <div style={{ flex: 1 }}>
                                  <div style={{ fontSize: 13, fontWeight: 500 }}>{scanned.description || `${scanned.width || "?"}" ${(scanned.type || "cabinet").replace(/_/g, " ")}`}</div>
                                  {scanned.location && <div style={{ fontSize: 10, color: "#8B7355", marginTop: 2 }}>{scanned.location}</div>}
                                  {scanned.style_notes && <div style={{ fontSize: 10, opacity: 0.4, marginTop: 1 }}>{scanned.style_notes}</div>}
                                </div>
                                <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 6, marginLeft: 8 }}>
                                  <span style={{ fontSize: 9, padding: "2px 7px", borderRadius: 8, background: `${confidenceColor[scanned.confidence]}22`, color: confidenceColor[scanned.confidence], fontWeight: 600 }}>
                                    {scanned.confidence}
                                  </span>
                                  <span style={{ fontSize: 11, opacity: 0.4 }}>qty {scanned.qty || 1}</span>
                                  {/* Remove / restore button */}
                                  <button onClick={() => toggleExclude(i)} style={{
                                    border: `1px solid ${excluded ? "#4a7c59" : "#E0D0C0"}`,
                                    background: excluded ? "#F0F7F2" : "#FEF3EB",
                                    color: excluded ? "#4a7c59" : "#8B5E3C",
                                    borderRadius: 6, padding: "3px 9px",
                                    fontSize: 10, cursor: "pointer", fontFamily: "inherit",
                                    fontWeight: 600, letterSpacing: 0.5
                                  }}>
                                    {excluded ? "↩ Restore" : "✕ Remove"}
                                  </button>
                                </div>
                              </div>

                              {!excluded && (<>
                                {/* Exact match prices */}
                                {match && (
                                  <div style={{ marginTop: 8, display: "flex", gap: 6 }}>
                                    <div style={{ flex: 1, background: "#F0F7F2", borderRadius: 6, padding: "6px 8px" }}>
                                      <div style={{ fontSize: 8, color: "#4a7c59", marginBottom: 1 }}>COST</div>
                                      <div style={{ fontSize: 13, fontWeight: 600, color: "#4a7c59" }}>{fmt(match[tier] * MFC_COST_MULT)}</div>
                                    </div>
                                    <div style={{ flex: 1, background: "#1a1a1a", borderRadius: 6, padding: "6px 8px" }}>
                                      <div style={{ fontSize: 8, color: "#C4956A", marginBottom: 1 }}>SELL</div>
                                      <div style={{ fontSize: 13, fontWeight: 600, color: "#C4956A" }}>{fmt(match[tier] * 0.35 * JK_SELL_MULT)}</div>
                                    </div>
                                    <div style={{ flex: 1, background: "#F5F2ED", borderRadius: 6, padding: "6px 8px" }}>
                                      <div style={{ fontSize: 8, opacity: 0.4, marginBottom: 1 }}>MATCH</div>
                                      <div style={{ fontSize: 10, fontWeight: 600, color: "#8B7355" }}>{match.id}</div>
                                    </div>
                                  </div>
                                )}

                                {/* Cubic foot estimated prices */}
                                {!match && est && (
                                  <>
                                    <div style={{ marginTop: 8, display: "flex", gap: 6 }}>
                                      <div style={{ flex: 1, background: "#F0F7F2", borderRadius: 6, padding: "6px 8px" }}>
                                        <div style={{ fontSize: 8, color: "#4a7c59", marginBottom: 1 }}>EST. COST</div>
                                        <div style={{ fontSize: 13, fontWeight: 600, color: "#4a7c59" }}>{fmt(est.cost)}</div>
                                      </div>
                                      <div style={{ flex: 1, background: "#1a1a1a", borderRadius: 6, padding: "6px 8px" }}>
                                        <div style={{ fontSize: 8, color: "#C4956A", marginBottom: 1 }}>EST. SELL</div>
                                        <div style={{ fontSize: 13, fontWeight: 600, color: "#C4956A" }}>{fmt(est.sell)}</div>
                                      </div>
                                      <div style={{ flex: 1, background: "#F5F2ED", borderRadius: 6, padding: "6px 8px" }}>
                                        <div style={{ fontSize: 8, opacity: 0.4, marginBottom: 1 }}>CU FT</div>
                                        <div style={{ fontSize: 12, fontWeight: 600, color: "#8B7355" }}>{est.cf} ft³</div>
                                      </div>
                                    </div>
                                    <div style={{ marginTop: 5, fontSize: 9, opacity: 0.45, display: "flex", gap: 6 }}>
                                      <span>~ estimated via cubic ft</span>
                                      <span>·</span>
                                      <span>${est.ratePerCf}/ft³ avg rate</span>
                                    </div>
                                  </>
                                )}

                                {/* No match, no estimate */}
                                {!match && !est && (
                                  <div style={{ marginTop: 6, fontSize: 10, color: "#c0392b", opacity: 0.7 }}>
                                    ⚠ Could not estimate — missing dimensions
                                  </div>
                                )}
                              </>)}

                              {excluded && (
                                <div style={{ marginTop: 6, fontSize: 11, opacity: 0.4 }}>Removed from quote</div>
                              )}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Estimated total */}
                {(() => {
                  const tier = finishTier(scanFinish);
                  const allCabs = scanResult.cabinets || [];
                  let totalSellEst = 0, totalCostEst = 0, totalQty = 0;
                  let exactCount = 0, estCount = 0;
                  const removedCount = scanExcluded.size;

                  allCabs.forEach((s, i) => {
                    if (scanExcluded.has(i)) return;
                    const qty = s.qty || 1;
                    const match = matchCatalog(s);
                    if (match) {
                      totalSellEst += match[tier] * 0.35 * JK_SELL_MULT * qty;
                      totalCostEst += match[tier] * MFC_COST_MULT * qty;
                      totalQty += qty;
                      exactCount++;
                    } else {
                      const est = estimatePrice(s);
                      if (est) {
                        totalSellEst += est.sell * qty;
                        totalCostEst += est.cost * qty;
                        totalQty += qty;
                        estCount++;
                      }
                    }
                  });

                  const assemblyEst = totalQty * 20;
                  if (totalSellEst === 0) return null;
                  return (
                    <div style={{ background: "#fff", borderRadius: 14, border: "1px solid #E5DFD6", overflow: "hidden", marginBottom: 14 }}>
                      <div style={{ background: "#F5F2ED", padding: "10px 16px", borderBottom: "1px solid #E5DFD6", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <div style={{ fontSize: 10, letterSpacing: 2, opacity: 0.5 }}>ESTIMATED PROJECT TOTAL</div>
                        <div style={{ fontSize: 10, opacity: 0.5 }}>
                          {exactCount} exact · {estCount} est.{removedCount > 0 && ` · ${removedCount} removed`}
                        </div>
                      </div>
                      <div style={{ padding: "14px 16px" }}>
                        {[
                          ["Cabinets (sell)", fmt(totalSellEst)],
                          [`Assembly (${totalQty} × $20)`, fmt(assemblyEst)],
                          ["Shipping", fmt(260)],
                        ].map(([l, v]) => (
                          <div key={l} style={{ display: "flex", justifyContent: "space-between", marginBottom: 10, paddingBottom: 10, borderBottom: "1px solid #EDE9E2", fontSize: 13 }}>
                            <span style={{ opacity: 0.6 }}>{l}</span><span style={{ fontWeight: 500 }}>{v}</span>
                          </div>
                        ))}
                        <div style={{ display: "flex", justifyContent: "space-between", background: "#1a1a1a", borderRadius: 10, padding: "12px 14px", alignItems: "center", marginBottom: 8 }}>
                          <div>
                            <div style={{ fontSize: 12, color: "#C4956A", fontWeight: 600 }}>Project Estimate</div>
                            <div style={{ fontSize: 10, color: "#C4956A", opacity: 0.5, marginTop: 2 }}>
                              {exactCount > 0 && `${exactCount} catalog`}{exactCount > 0 && estCount > 0 && " + "}{estCount > 0 && `${estCount} cubic ft est.`}
                            </div>
                          </div>
                          <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 26, color: "#C4956A" }}>
                            {fmt(totalSellEst + assemblyEst + 260)}
                          </div>
                        </div>
                        <div style={{ display: "flex", justifyContent: "space-between", padding: "10px 12px", background: "#F0F7F2", borderRadius: 8, fontSize: 12 }}>
                          <span style={{ color: "#4a7c59" }}>Your Cost</span>
                          <span style={{ color: "#4a7c59", fontWeight: 600 }}>{fmt(totalCostEst + assemblyEst + 260)}</span>
                        </div>
                        {estCount > 0 && (
                          <div style={{ marginTop: 8, fontSize: 10, opacity: 0.4, textAlign: "center" }}>
                            {estCount} cabinet{estCount > 1 ? "s" : ""} priced via cubic ft interpolation · verify against catalog
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })()}

                {/* Add to quote button */}
                <button onClick={addAllToQuote} style={{
                  width: "100%", padding: "14px", background: "#4a7c59", color: "#fff",
                  border: "none", borderRadius: 12, fontSize: 14, fontWeight: 600,
                  cursor: "pointer", fontFamily: "inherit", marginBottom: 8
                }}>
                  ✓ Add {scanResult.cabinets.length - scanExcluded.size} Cabinet{scanResult.cabinets.length - scanExcluded.size !== 1 ? "s" : ""} to {activeQuote?.name}
                </button>
                <button onClick={() => { setScanStatus("idle"); setScanResult(null); setScanImage(null); setScanImageUrl(null); setScanExcluded(new Set()); }} style={{
                  width: "100%", padding: "12px", background: "transparent",
                  border: "1px solid #D4CBB8", color: "#999", borderRadius: 12,
                  fontSize: 11, letterSpacing: 2, cursor: "pointer", fontFamily: "inherit"
                }}>CLEAR & START OVER</button>
              </>
            )}
          </div>
        );
      })()}

      {/* ── HISTORY TAB ── */}
      {tab === "history" && (
        <div style={{ padding: "16px 14px 32px" }}>
          <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 22, marginBottom: 4 }}>History</div>
          <div style={{ fontSize: 11, opacity: 0.4, marginBottom: 16 }}>Saved quotes persist between sessions.</div>

          {/* Search */}
          {archivedQuotes.length > 0 && (
            <div style={{ position: "relative", marginBottom: 14 }}>
              <span style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", opacity: 0.35, fontSize: 14 }}>🔍</span>
              <input value={historySearch} onChange={e => setHistorySearch(e.target.value)}
                placeholder="Search by quote name…"
                style={{ width: "100%", padding: "9px 12px 9px 34px", border: "1px solid #D4CBB8", borderRadius: 8, fontSize: 13, background: "#fff", fontFamily: "inherit" }} />
            </div>
          )}

          {archivedQuotes.length === 0 && (
            <div style={{ textAlign: "center", padding: "60px 20px", opacity: 0.3 }}>
              <div style={{ fontSize: 36, marginBottom: 12 }}>🗄</div>
              <div style={{ fontSize: 14, letterSpacing: 1 }}>NO SAVED QUOTES</div>
              <div style={{ fontSize: 11, marginTop: 8, opacity: 0.7 }}>Hit ✓ Save on any quote to archive it here</div>
            </div>
          )}

          {archivedQuotes
            .filter(q => !historySearch || q.name.toLowerCase().includes(historySearch.toLowerCase()))
            .map((q) => {
              const date = new Date(q.archivedAt);
              const dateStr = date.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
              const timeStr = date.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
              const isPaint = q.items.every(c => TIER_PAINT_FINISHES.includes(c.finish));
              const finishes = [...new Set(q.items.map(c => c.finish))];
              return (
                <div key={q.archivedAt} style={{ background: "#fff", borderRadius: 12, border: "1px solid #E5DFD6", overflow: "hidden", marginBottom: 10 }}>
                  {/* Header */}
                  <div style={{ padding: "12px 16px", display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 15, fontWeight: 600 }}>{q.name}</div>
                      <div style={{ fontSize: 10, opacity: 0.4, marginTop: 2 }}>{dateStr} · {timeStr}</div>
                      <div style={{ display: "flex", gap: 4, marginTop: 6, flexWrap: "wrap" }}>
                        <span style={{ fontSize: 10, padding: "2px 8px", background: "#F5F2ED", borderRadius: 8, color: "#8B7355" }}>
                          {q.items.reduce((s, c) => s + c.qty, 0)} cabinets
                        </span>
                        {finishes.slice(0, 2).map(f => (
                          <span key={f} style={{ fontSize: 10, padding: "2px 8px", borderRadius: 8,
                            background: TIER_PAINT_FINISHES.includes(f) ? "#F5F0FA" : TIER_TWO_FINISHES.includes(f) ? "#FEF3EB" : "#F5F2ED",
                            color: TIER_PAINT_FINISHES.includes(f) ? "#7B4F9E" : TIER_TWO_FINISHES.includes(f) ? "#8B5E3C" : "#666"
                          }}>{f}</span>
                        ))}
                        {finishes.length > 2 && <span style={{ fontSize: 10, opacity: 0.4 }}>+{finishes.length - 2} more</span>}
                      </div>
                    </div>
                    <div style={{ textAlign: "right", flexShrink: 0, marginLeft: 12 }}>
                      <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 22, color: isPaint ? "#7B4F9E" : "#C4956A" }}>{fmt(q.totalSell)}</div>
                    </div>
                  </div>
                  {/* Cabinet list — collapsed summary */}
                  <div style={{ padding: "0 16px 8px", display: "flex", flexDirection: "column", gap: 3 }}>
                    {q.items.slice(0, 4).map((item, i) => (
                      <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 11, opacity: 0.55 }}>
                        <span>{item.id} × {item.qty}</span>
                        <span>{fmt(item.price * item.qty)}</span>
                      </div>
                    ))}
                    {q.items.length > 4 && (
                      <div style={{ fontSize: 10, opacity: 0.35 }}>+{q.items.length - 4} more items</div>
                    )}
                  </div>
                  {/* Actions */}
                  <div style={{ display: "flex", gap: 0, borderTop: "1px solid #F0EDE8" }}>
                    <button onClick={() => restoreArchived(q)} style={{
                      flex: 1, padding: "10px", border: "none", background: "transparent",
                      fontSize: 12, cursor: "pointer", color: "#4a7c59", fontWeight: 600, fontFamily: "inherit"
                    }}>↩ Restore to Quote</button>
                    <div style={{ width: 1, background: "#F0EDE8" }} />
                    <button onClick={() => deleteArchived(q.archivedAt)} style={{
                      padding: "10px 16px", border: "none", background: "transparent",
                      fontSize: 12, cursor: "pointer", color: "#c0392b", fontFamily: "inherit"
                    }}>🗑</button>
                  </div>
                </div>
              );
            })}
        </div>
      )}

      {/* ── QUOTE MANAGER SHEET ── */}
      {showQuoteManager && (
        <div className="sheet-overlay" onClick={() => setShowQuoteManager(false)}>
          <div className="sheet" onClick={(e) => e.stopPropagation()}>
            <div className="sheet-handle" />
            <div style={{ padding: "0 18px 14px" }}>
              <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 2 }}>Quotes</div>
              <div style={{ fontSize: 11, opacity: 0.4, marginBottom: 16 }}>Select a quote to make it active — items from the catalog will be added to the active quote.</div>

              {quotes.map((q) => {
                const qCount = q.items.reduce((s, i) => s + i.qty, 0);
                const qSell = q.items.reduce((s, i) => s + i.price * i.qty, 0) + q.items.reduce((s,i)=>s+i.qty,0)*ASSEMBLY_FEE + SHIPPING_FEE;
                const isActive = q.id === activeQuoteId;
                return (
                  <div key={q.id} style={{
                    background: isActive ? "#1a1a1a" : "#fff",
                    color: isActive ? "#F5F2ED" : "#1a1a1a",
                    border: `1.5px solid ${isActive ? "#1a1a1a" : "#E5DFD6"}`,
                    borderRadius: 12, padding: "14px 16px", marginBottom: 8,
                    cursor: isActive ? "default" : "pointer",
                    transition: "all 0.15s"
                  }} onClick={() => { if (!isActive) { setActiveQuoteId(q.id); setShowQuoteManager(false); } }}>

                    {editingName === q.id ? (
                      <div style={{ display: "flex", gap: 8 }} onClick={e => e.stopPropagation()}>
                        <input value={nameInput} onChange={e => setNameInput(e.target.value)} autoFocus
                          onKeyDown={e => e.key === "Enter" && renameQuote(q.id)}
                          style={{ flex: 1, padding: "8px 10px", border: "1.5px solid #C4956A", borderRadius: 6, fontSize: 13, background: "#fff", color: "#1a1a1a" }} />
                        <button onClick={() => renameQuote(q.id)} style={{ background: "#C4956A", color: "#fff", border: "none", borderRadius: 6, padding: "8px 12px", cursor: "pointer", fontSize: 12, fontFamily: "inherit" }}>Save</button>
                        <button onClick={() => setEditingName(null)} style={{ background: "transparent", border: "1px solid #ccc", borderRadius: 6, padding: "8px 10px", cursor: "pointer", fontSize: 12, color: isActive ? "#F5F2ED" : "#1a1a1a" }}>✕</button>
                      </div>
                    ) : (
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <div>
                          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                            <div style={{ fontSize: 15, fontWeight: 600 }}>{q.name}</div>
                            {isActive && <span style={{ fontSize: 9, background: "#C4956A", color: "#fff", borderRadius: 8, padding: "2px 7px", letterSpacing: 1 }}>ACTIVE</span>}
                          </div>
                          <div style={{ fontSize: 11, opacity: 0.5, marginTop: 3 }}>
                            {qCount > 0 ? `${qCount} cabinet${qCount !== 1 ? "s" : ""} · ${fmt(qSell)}` : "Empty"}
                          </div>
                        </div>
                        <div style={{ display: "flex", gap: 6 }} onClick={e => e.stopPropagation()}>
                          <button onClick={() => { setEditingName(q.id); setNameInput(q.name); }} style={{
                            background: isActive ? "#2a2a2a" : "#F5F2ED", border: "none",
                            borderRadius: 6, padding: "6px 10px", fontSize: 11, cursor: "pointer",
                            color: isActive ? "#F5F2ED" : "#666", fontFamily: "inherit"
                          }}>✏</button>
                          <button onClick={() => duplicateQuote(q.id)} style={{
                            background: isActive ? "#2a2a2a" : "#F5F2ED", border: "none",
                            borderRadius: 6, padding: "6px 10px", fontSize: 11, cursor: "pointer",
                            color: isActive ? "#F5F2ED" : "#666", fontFamily: "inherit"
                          }}>⎘</button>
                          {quotes.length > 1 && (
                            <button onClick={() => deleteQuote(q.id)} style={{
                              background: "#FEF0F0", border: "none", borderRadius: 6, padding: "6px 10px", fontSize: 11, cursor: "pointer", color: "#c0392b"
                            }}>🗑</button>
                          )}
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}

              <button onClick={addQuote} style={{
                width: "100%", marginTop: 8, padding: "14px", background: "#F5F2ED",
                border: "1.5px dashed #C4956A", borderRadius: 12, fontSize: 13, fontWeight: 600,
                cursor: "pointer", color: "#C4956A", fontFamily: "inherit",
                display: "flex", alignItems: "center", justifyContent: "center", gap: 8
              }}>+ New Quote</button>
            </div>
          </div>
        </div>
      )}

      {/* ── FINISH CHANGE CONFIRMATION ── */}
      {pendingFinishChange && (() => {
        const { itemIdx, newFinish } = pendingFinishChange;
        const item = cart[itemIdx];
        const oldFinish = item?.finish;
        const isPaintNew = TIER_PAINT_FINISHES.includes(newFinish);
        const isPaintOld = TIER_PAINT_FINISHES.includes(oldFinish);
        const finishColor = isPaintNew ? "#7B4F9E" : TIER_TWO_FINISHES.includes(newFinish) ? "#C4956A" : "#4a7c59";
        return (
          <div className="sheet-overlay" onClick={() => setPendingFinishChange(null)}>
            <div className="sheet" onClick={e => e.stopPropagation()} style={{ paddingBottom: 32 }}>
              <div className="sheet-handle" />
              <div style={{ padding: "0 18px 20px" }}>
                {/* Header */}
                <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 4 }}>Change Finish</div>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 20 }}>
                  <span style={{ fontSize: 12, opacity: 0.5, padding: "3px 10px", background: "#F5F2ED", borderRadius: 8 }}>{oldFinish}</span>
                  <span style={{ opacity: 0.4 }}>→</span>
                  <span style={{ fontSize: 12, fontWeight: 700, padding: "3px 10px", background: `${finishColor}18`, color: finishColor, borderRadius: 8, border: `1px solid ${finishColor}44` }}>{newFinish}</span>
                </div>

                {/* Option 1 — change all */}
                <button onClick={() => {
                  changeAllFinishes(newFinish);
                  setPendingFinishChange(null);
                }} style={{
                  width: "100%", padding: "16px", marginBottom: 10,
                  background: "#1a1a1a", color: "#F5F2ED",
                  border: "none", borderRadius: 12, cursor: "pointer",
                  fontFamily: "inherit", textAlign: "left"
                }}>
                  <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 4 }}>
                    Change all {cart.length} cabinets to {newFinish}
                  </div>
                  <div style={{ fontSize: 11, opacity: 0.5 }}>
                    Updates every item in this quote to the new finish
                  </div>
                </button>

                {/* Option 2 — change just this one */}
                <button onClick={() => {
                  changeItemFinish(itemIdx, newFinish);
                  setPendingFinishChange(null);
                }} style={{
                  width: "100%", padding: "16px", marginBottom: 10,
                  background: "#fff", color: "#1a1a1a",
                  border: "1.5px solid #E5DFD6", borderRadius: 12, cursor: "pointer",
                  fontFamily: "inherit", textAlign: "left"
                }}>
                  <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 4 }}>
                    Change only {item?.id} to {newFinish}
                  </div>
                  <div style={{ fontSize: 11, opacity: 0.5 }}>
                    Other cabinets stay as {oldFinish}
                  </div>
                </button>

                {/* Cancel */}
                <button onClick={() => setPendingFinishChange(null)} style={{
                  width: "100%", padding: "12px",
                  background: "transparent", border: "none",
                  color: "#999", cursor: "pointer", fontFamily: "inherit", fontSize: 12
                }}>Cancel</button>
              </div>
            </div>
          </div>
        );
      })()}

      {/* Finish Picker Sheet */}
      {(showFinishPicker || finishPickerFor !== null) && (() => {
        const isItemPicker = finishPickerFor !== null;
        const currentFinish = isItemPicker ? cart[finishPickerFor.itemIdx]?.finish : finish;
        const close = () => { setShowFinishPicker(false); setFinishPickerFor(null); };
        const pick = (f) => {
          if (isItemPicker) {
            const currentF = cart[finishPickerFor.itemIdx]?.finish;
            if (f === currentF) { close(); return; }
            // If quote has multiple items, ask if they want to change all
            if (cart.length > 1) {
              setPendingFinishChange({ itemIdx: finishPickerFor.itemIdx, newFinish: f });
              close();
            } else {
              changeItemFinish(finishPickerFor.itemIdx, f);
              close();
            }
          } else {
            setFinish(f);
            close();
          }
        };
        return (
          <div className="sheet-overlay" onClick={close}>
            <div className="sheet" onClick={(e) => e.stopPropagation()}>
              <div className="sheet-handle" />
              <div style={{ padding: "0 18px 12px", fontSize: 13, letterSpacing: 2, opacity: 0.4 }}>
                {isItemPicker ? `FINISH — ${cart[finishPickerFor.itemIdx]?.id}` : "SELECT FINISH"}
              </div>

              {/* Paint Grade — featured at top */}
              <div style={{ margin: "0 14px 14px", background: "linear-gradient(135deg, #F5F0FA, #EDE5F8)", borderRadius: 12, border: "1.5px solid #C4A8E0", overflow: "hidden" }}>
                <div style={{ padding: "10px 14px 4px", display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 16 }}>🎨</span>
                  <div>
                    <div style={{ fontSize: 12, fontWeight: 700, color: "#7B4F9E", letterSpacing: 0.5 }}>PAINT GRADE</div>
                    <div style={{ fontSize: 10, color: "#7B4F9E", opacity: 0.6 }}>Custom painted · 2.0× Tier 1 retail</div>
                  </div>
                </div>
                {TIER_PAINT_FINISHES.map((f) => (
                  <div key={f} onClick={() => pick(f)} style={{
                    display: "flex", justifyContent: "space-between", alignItems: "center",
                    padding: "12px 14px", cursor: "pointer", borderTop: "1px solid #C4A8E040"
                  }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <span style={{ width: 12, height: 12, borderRadius: "50%", background: "linear-gradient(135deg,#f0e6ff,#7B4F9E)", display: "inline-block", border: "1.5px solid #7B4F9E88", flexShrink: 0 }}></span>
                      <span style={{ fontSize: 14, color: "#7B4F9E", fontWeight: 600 }}>{f}</span>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ fontSize: 10, color: "#7B4F9E", opacity: 0.6, background: "#7B4F9E18", padding: "2px 8px", borderRadius: 8 }}>2× retail</span>
                      {currentFinish === f && <span style={{ color: "#4a7c59", fontSize: 16 }}>✓</span>}
                    </div>
                  </div>
                ))}
              </div>

              <div style={{ padding: "4px 18px 8px", fontSize: 11, color: "#8B7355", letterSpacing: 1 }}>TIER ONE</div>
              {TIER_ONE_FINISHES.map((f) => (
                <div key={f} className="finish-option" onClick={() => pick(f)}>
                  <span style={{ fontSize: 14 }}>{f}</span>
                  {currentFinish === f && <span style={{ color: "#4a7c59", fontSize: 16 }}>✓</span>}
                </div>
              ))}
              <div style={{ padding: "12px 18px 8px", fontSize: 11, color: "#C4956A", letterSpacing: 1 }}>TIER TWO</div>
              {TIER_TWO_FINISHES.map((f) => (
                <div key={f} className="finish-option" onClick={() => pick(f)}>
                  <span style={{ fontSize: 14 }}>{f}</span>
                  {currentFinish === f && <span style={{ color: "#4a7c59", fontSize: 16 }}>✓</span>}
                </div>
              ))}
              ))}
              {/* Box section */}
              <div style={{ padding: "12px 18px 6px", borderTop: "1px solid #EDE9E2", marginTop: 4 }}>
                <div style={{ fontSize: 11, color: "#2563EB", letterSpacing: 1, marginBottom: 2 }}>📦 MODERNFORM BOX</div>
                <div style={{ fontSize: 10, opacity: 0.45, marginBottom: 6 }}>Carcass only · sell at 2× your cost</div>
              </div>
              {TIER_BOX_FINISHES.map((f) => (
                <div key={f} className="finish-option" onClick={() => pick(f)}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ width: 10, height: 10, borderRadius: "50%", background: "#2563EB", display: "inline-block", flexShrink: 0 }}></span>
                    <span style={{ fontSize: 14, color: "#2563EB", fontWeight: 500 }}>{f}</span>
                    <span style={{ fontSize: 10, color: "#2563EB", opacity: 0.5 }}>{f === "Box + Deluxe" ? "box + deluxe doors" : "box only"}</span>
                  </div>
                  {currentFinish === f && <span style={{ color: "#4a7c59", fontSize: 16 }}>✓</span>}
                </div>
              ))}
            </div>
          </div>
        );
      })()}
    </div>
  );
}

  </script>
</body>
</html>
