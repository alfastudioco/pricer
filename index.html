<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Alfa Studio · Cabinet Pricing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #F5F2ED; }
    input, button, select { font-family: inherit; }
    #loader {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; gap: 16px; color: #8B7355;
    }
    #loader .spinner {
      width: 36px; height: 36px; border: 3px solid #D4CBB8;
      border-top-color: #C4956A; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader .label { font-size: 12px; letter-spacing: 2px; opacity: 0.6; }
  </style>
</head>
<body>
  <div id="root">
    <div id="loader">
      <div class="spinner"></div>
      <div class="label">LOADING ALFA STUDIO</div>
    </div>
  </div>

  <!-- Load React first, synchronously -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Load Babel, then compile and mount -->
  <script>
    function loadBabel() {
      return new Promise((resolve) => {
        const s = document.createElement('script');
        s.src = 'https://unpkg.com/@babel/standalone@7.23.10/babel.min.js';
        s.onload = resolve;
        document.head.appendChild(s);
      });
    }

    loadBabel().then(() => {
      const code = document.getElementById('app-source').textContent;
      const compiled = Babel.transform(code, {
        presets: ['react'],
        filename: 'app.jsx'
      }).code;

      // Execute the compiled code
      const fn = new Function('React', 'ReactDOM', compiled + '\nreturn App;');
      const App = fn(React, ReactDOM);

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(App));
    }).catch(err => {
      document.getElementById('root').innerHTML =
        '<div style="padding:40px;color:#c0392b;font-family:monospace">' +
        '<b>Load error:</b><br>' + err.message + '</div>';
    });
  </script>

  <!-- App source stored as inert text, compiled on demand -->
  <script id="app-source" type="text/plain">
const { useState, useMemo, useEffect, useCallback } = React;

// ── CABINET ICON SYSTEM ───────────────────────────────────────────────────────

const FINISH_COLORS = {
  "White":           { body:"#F8F6F2", door:"#EFEFEB", pull:"#9A8F85", border:"#D4CBB8", shadow:"#DDD8D0" },
  "Gray":            { body:"#C8C5C0", door:"#B8B5B0", pull:"#6A6560", border:"#9A9590", shadow:"#A8A5A0" },
  "Modern Slate":    { body:"#7A8A8F", door:"#6A7A7F", pull:"#3A4A4F", border:"#5A6A6F", shadow:"#5A6A6F" },
  "Espresso":        { body:"#3D2B1F", door:"#2D1B0F", pull:"#C4956A", border:"#1D0B00", shadow:"#2D1B0F" },
  "Signature Blue":  { body:"#4A6B8A", door:"#3A5B7A", pull:"#C4956A", border:"#2A4B6A", shadow:"#3A5B7A" },
  "Natural":         { body:"#C8A882", door:"#B89872", pull:"#7A6050", border:"#A88860", shadow:"#A88860" },
  "Onyx Black":      { body:"#2A2A2A", door:"#1A1A1A", pull:"#C4956A", border:"#0A0A0A", shadow:"#1A1A1A" },
  "Slim Dove White": { body:"#F0EDE8", door:"#E0DDD8", pull:"#9A8F85", border:"#C8C5C0", shadow:"#D8D5D0" },
  "Slim Sage Green": { body:"#8A9E8A", door:"#7A8E7A", pull:"#3A4A3A", border:"#5A6E5A", shadow:"#6A7E6A" },
};
const DEF = FINISH_COLORS["White"];

function pw(desc) { const m = (desc||"").match(/^(\d+)/); return m ? parseInt(m[1]) : 24; }
function ph(desc) { const m = (desc||"").match(/\d+x(\d+)/); return m ? parseInt(m[1]) : 30; }

function cabinetType(id, desc) {
  const d = (desc || "").toLowerCase(), i = (id || "").toLowerCase();
  if (d.includes("3 drawer")||d.includes("3-drawer")||i.startsWith("3db")||i.startsWith("vdb")) return "3drw";
  if (d.includes("2 drawer")||d.includes("2-drawer")||i.startsWith("2db")) return "2drw";
  if (d.includes("farm house")||d.includes("farmhouse")) return "farm";
  if (d.includes("sink base")||d.includes("sink cabinet")||d.includes("sink base")) return "sink";
  if (d.includes("vanity sink")||d.includes("sink base")&&i.startsWith("vs")) return "vsink";
  if (d.includes("vanity")) return "vanity";
  if (d.includes("wall lazy susan")) return "wls";
  if (d.includes("lazy susan")) return "ls";
  if (d.includes("wall blind")||d.includes("wall blind")) return "wblind";
  if (d.includes("blind corner")) return "blind";
  if (d.includes("diagonal corner")) return "diag";
  if (d.includes("microwave")) return "micro";
  if (d.includes("wine rack")||d.includes("wine")) return "wine";
  if (d.includes("mirror")) return "mirror";
  if (d.includes("spice")) return "spice";
  if (d.includes("glass door only")) return "glassdoor";
  if (d.includes("pantry")||d.includes("oven cabinet")) return "pantry";
  if (d.includes("roll out")||i.startsWith("rot")) return "rollout";
  if (d.includes("wall end shelf")||d.includes("end shelf")) return "endshelf";
  if (d.includes("wall end")||d.includes("end cabinet")) return "wallend";
  if (d.includes("wall cabinet")||i.startsWith("w")) return "wall";
  if (d.includes("molding")) return "mold";
  if (d.includes("panel")) return "panel";
  if (d.includes("filler")) return "fill";
  if (d.includes("toe kick")) return "toe";
  if (d.includes("false door")) return "fdoor";
  if (d.includes("post")) return "post";
  return "base";
}

// Scale width to SVG units, clamped
function sw(w, min=28, max=68, factor=2.0) { return Math.max(min, Math.min(w*factor, max)); }

function BaseIcon({ w=24, c=DEF }) {
  const vw=sw(w); return (
  <svg viewBox={`0 0 ${vw} 62`} width={vw} height={62}>
    <rect x="1" y="1" width={vw-2} height="58" rx="2" fill={c.body} stroke={c.border} strokeWidth="1.2"/>
    <rect x="1" y="1" width={vw-2} height="6" rx="2" fill={c.shadow}/>
    <rect x="5" y="11" width={vw-10} height="40" rx="1.5" fill={c.door} stroke={c.border} strokeWidth="0.8"/>
    <rect x="8" y="14" width={vw-16} height="34" rx="1" fill="none" stroke={c.border} strokeWidth="0.5" opacity="0.4"/>
    <rect x={vw/2-3} y="29" width="6" height="2.5" rx="1" fill={c.pull}/>
    <rect x="1" y="55" width={vw-2} height="4" rx="0" fill={c.shadow}/>
    <text x={vw/2} y="60" textAnchor="middle" fontSize="5" fill={c.pull} fontFamily="monospace">{w}"</text>
  </svg>);}

function DrawerIcon({ w=24, n=3, c=DEF }) {
  const vw=sw(w); const dh=n===3?14:19; const sy=9;
  return (<svg viewBox={`0 0 ${vw} 62`} width={vw} height={62}>
    <rect x="1" y="1" width={vw-2} height="58" rx="2" fill={c.body} stroke={c.border} strokeWidth="1.2"/>
    <rect x="1" y="1" width={vw-2} height="5" rx="2" fill={c.shadow}/>
    {[...Array(n)].map((_,idx)=>(
      <g key={idx}>
        <rect x="5" y={sy+idx*(dh+2)} width={vw-10} height={dh} rx="1.5" fill={c.door} stroke={c.border} strokeWidth="0.8"/>
        <rect x={vw/2-4} y={sy+idx*(dh+2)+dh/2-1} width="8" height="2" rx="1" fill={c.pull}/>
      </g>))}
    <rect x="1" y="55" width={vw-2} height="4" fill={c.shadow}/>
    <text x={vw/2} y="60" textAnchor="middle" fontSize="5" fill={c.pull} fontFamily="monospace">{w}"</text>
  </svg>);}

function SinkIcon({ w=30, c=DEF, farm=false }) {
  const vw=sw(w,34,74,1.9);
  return (<svg viewBox={`0 0 ${vw} 62`} width={vw} height={62}>
    <rect x="1" y="1" width={vw-2} height="58" rx="2" fill={c.body} stroke={c.border} strokeWidth="1.2"/>
    <rect x="1" y="1" width={vw-2} height="5" rx="2" fill={c.shadow}/>
    {farm && <rect x="4" y="1" width={vw-8} height="8" rx="1" fill={c.door} stroke={c.border} strokeWidth="0.8"/>}
    {!farm && <path d={`M${vw*0.2} 3 Q${vw/2} 6 ${vw*0.8} 3`} stroke={c.pull} strokeWidth="0.9" fill="none" opacity="0.4"/>}
    <rect x="4" y={farm?10:9} width={vw/2-7} height="43" rx="1.5" fill={c.door} stroke={c.border} strokeWidth="0.8"/>
    <rect x={vw/2+2} y={farm?10:9} width={vw/2-7} height="43" rx="1.5" fill={c.door} stroke={c.border} strokeWidth="0.8"/>
    <rect x={vw/2-9} y="29" width="4" height="2" rx="1" fill={c.pull}/>
    <rect x={vw/2+5} y="29" width="4" height="2" rx="1" fill={c.pull}/>
    <rect x="1" y="55" width={vw-2} height="4" fill={c.shadow}/>
    <text x={vw/2} y="60" textAnchor="middle" fontSize="5" fill={c.pull} fontFamily="monospace">{w}"</text>
  </svg>);}

function WallIcon({ w=30, h=30, c=DEF }) {
  const vw=sw(w,26,66,1.7); const vh=Math.max(26,Math.min(h*0.85,54)); const two=w>=24;
  return (<svg viewBox={`0 0 ${vw} ${vh+5}`} width={vw} height={vh+5}>
    <rect x="1" y="1" width={vw-2} height={vh} rx="2" fill={c.body} stroke={c.border} strokeWidth="1.2"/>
    <rect x="1" y="1" width={vw-2} height="4" rx="2" fill={c.shadow}/>
    {two ? (<>
      <rect x="4" y="7" width={vw/2-7} height={vh-10} rx="1.5" fill={c.door} stroke={c.border} strokeWidth="0.8"/>
      <rect x={vw/2+2} y="7" width={vw/2-7} height={vh-10} rx="1.5" fill={c.door} stroke={c.border} strokeWidth="0.8"/>
      <rect x={vw/2-8} y={vh/2-1} width="4" height="2" rx="1" fill={c.pull}/>
      <rect x={vw/2+4} y={vh/2-1} width="4" height="2" rx="1" fill={c.pull}/>
    </>) : (<>
      <rect x="4" y="7" width={vw-8} height={vh-10} rx="1.5" fill={c.door} stroke={c.border} strokeWidth="0.8"/>
      <rect x={vw/2-3} y={vh/2-1} width="6" height="2" rx="1" fill={c.pull}/>
    </>)}
    <text x={vw/2} y={vh+4} textAnchor="middle" fontSize="4.5" fill={c.pull} fontFamily="monospace">{w}×{h}</text>
  </svg>);}

function GlassDoorIcon({ w=24, h=30, c=DEF }) {
  const vw=sw(w,24,58,1.7); const vh=Math.max(24,Math.min(h*0.85,50));
  return (<svg viewBox={`0 0 ${vw} ${vh+5}`} width={vw} height={vh+5}>
    <rect x="1" y="1" width={vw-2} height={vh} rx="2" fill={c.body} stroke={c.border} strokeWidth="1.2"/>
    <rect x="4" y="5" width={vw-8} height={vh-7} rx="1.5" fill="#D6EEF8" stroke={c.border} strokeWidth="0.8" opacity="0.85"/>
    <line x1={vw/2} y1="5" x2={vw/2} y2={vh-2} stroke={c.border} strokeWidth="0.7" opacity="0.6"/>
    <line x1="4" y1={vh/2} x2={vw-4} y2={vh/2} stroke={c.border} strokeWidth="0.7" opacity="0.6"/>
    <rect x={vw/2-3} y={vh/2-1} width="6" height="2" rx="1" fill={c.pull}/>
    <text x={vw/2} y={vh+4} textAnchor="middle" fontSize="4.5" fill={c.pull} fontFamily="monospace">GLASS</text>
  </svg>);}

function PantryIcon({ w=18, h=84, c=DEF }) {
  const vw=sw(w,28,58,2.4); const vh=90;
  return (<svg viewBox={`0 0 ${vw} ${vh}`} width={vw} height={vh}>
    <rect x="1" y="1" width={vw-2} height={vh-8} rx="2" fill={c.body} stroke={c.border} strokeWidth="1.2"/>
    <rect x="1" y="1" width={vw-2} height="5" rx="2" fill={c.shadow}/>
    <rect x="4" y="8" width={vw-8} height={(vh-20)*0.52} rx="1.5" fill={c.door} stroke={c.border} strokeWidth="0.8"/>
    <rect x="4" y={(vh-20)*0.52+12} width={vw-8} height={(vh-20)*0.42} rx="1.5" fill={c.door} stroke={c.border} strokeWidth="0.8"/>
    <rect x={vw/2-3} y={(vh-20)*0.52/2+8} width="6" height="2" rx="1" fill={c.pull}/>
    <rect x={vw/2-3} y={(vh-20)*0.52+12+(vh-20)*0.42/2} width="6" height="2" rx="1" fill={c.pull}/>
    <rect x="1" y={vh-11} width={vw-2} height="4" fill={c.shadow}/>
    <text x={vw/2} y={vh-1} textAnchor="middle" fontSize="4.5" fill={c.pull} fontFamily="monospace">{w}×{h}</text>
  </svg>);}

function VanityIcon({ w=24, c=DEF, sink=false, drawers=false }) {
  const vw=sw(w,30,70,1.9); const vh=55;
  return (<svg viewBox={`0 0 ${vw} ${vh}`} width={vw} height={vh}>
    <rect x="0" y="2" width={vw} height="4" rx="1" fill={c.shadow} opacity="0.8"/>
    <rect x="1" y="5" width={vw-2} height={vh-10} rx="2" fill={c.body} stroke={c.border} strokeWidth="1.2"/>
    {sink ? (<>
      <rect x="4" y="12" width={vw/2-6} height="28" rx="1.5" fill={c.door} stroke={c.border} strokeWidth="0.8"/>
      <rect x={vw/2+1} y="12" width={vw/2-6} height="28" rx="1.5" fill={c.door} stroke={c.border} strokeWidth="0.8"/>
      <rect x={vw/2-8} y="25" width="4" height="2" rx="1" fill={c.pull}/>
      <rect x={vw/2+4} y="25" width="4" height="2" rx="1" fill={c.pull}/>
      <ellipse cx={vw/2} cy="5" rx="9" ry="3.5" fill="#D6EEF8" opacity="0.7" stroke={c.border} strokeWidth="0.6"/>
    </>) : drawers ? (
      [0,1,2].map(idx=>(
        <g key={idx}>
          <rect x="4" y={12+idx*12} width={vw-8} height="10" rx="1.5" fill={c.door} stroke={c.border} strokeWidth="0.8"/>
          <rect x={vw/2-4} y={12+idx*12+3.5} width="8" height="2" rx="1" fill={c.pull}/>
        </g>))
    ) : (<>
      <rect x="4" y="12" width={vw-8} height="28" rx="1.5" fill={c.door} stroke={c.border} strokeWidth="0.8"/>
      <rect x={vw/2-3} y="25" width="6" height="2" rx="1" fill={c.pull}/>
    </>)}
    <rect x="1" y={vh-7} width={vw-2} height="4" fill={c.shadow}/>
    <text x={vw/2} y={vh-1} textAnchor="middle" fontSize="4.5" fill={c.pull} fontFamily="monospace">{w}"</text>
  </svg>);}

function LazySusanIcon({ w=33, c=DEF, wall=false }) {
  const vw=sw(w,36,70,1.9); const vh=wall?50:62;
  return (<svg viewBox={`0 0 ${vw} ${vh}`} width={vw} height={vh}>
    <rect x="1" y="1" width={vw-2} height={vh-8} rx="2" fill={c.body} stroke={c.border} strokeWidth="1.2"/>
    <rect x="1" y="1" width={vw-2} height="5" rx="2" fill={c.shadow}/>
    <path d={`M4 ${vh*0.14} L${vw/2-2} ${vh*0.14} L${vw/2-2} ${vh*0.84} L4 ${vh*0.84} Z`} fill={c.door} stroke={c.border} strokeWidth="0.8"/>
    <path d={`M${vw/2+2} ${vh*0.14} L${vw-4} ${vh*0.14} L${vw-4} ${vh*0.84} L${vw/2+2} ${vh*0.84} Z`} fill={c.door} stroke={c.border} strokeWidth="0.8"/>
    <circle cx={vw/2} cy={vh*0.47} r="7" fill="none" stroke={c.pull} strokeWidth="0.9" strokeDasharray="2,1.5" opacity="0.7"/>
    <circle cx={vw/2} cy={vh*0.47} r="2" fill={c.pull} opacity="0.6"/>
    {!wall && <rect x="1" y={vh-9} width={vw-2} height="4" fill={c.shadow}/>}
    <text x={vw/2} y={vh-1} textAnchor="middle" fontSize="4.5" fill={c.pull} fontFamily="monospace">{w}"</text>
  </svg>);}

function BlindCornerIcon({ w=39, c=DEF, wall=false }) {
  const vw=sw(w,38,72,1.7); const vh=wall?50:62;
  return (<svg viewBox={`0 0 ${vw} ${vh}`} width={vw} height={vh}>
    <rect x="1" y="1" width={vw-2} height={vh-8} rx="2" fill={c.body} stroke={c.border} strokeWidth="1.2"/>
    <rect x="1" y="1" width={vw-2} height="5" rx="2" fill={c.shadow}/>
    <rect x="4" y="9" width={vw*0.52} height={vh-20} rx="1.5" fill={c.door} stroke={c.border} strokeWidth="0.8"/>
    <rect x={vw*0.52+6} y="9" width={vw*0.3} height={vh-20} rx="1" fill={c.shadow} stroke={c.border} strokeWidth="0.6" strokeDasharray="2,2"/>
    <rect x={vw*0.52*0.5} y={(vh-20)/2+5} width="6" height="2" rx="1" fill={c.pull}/>
    {!wall && <rect x="1" y={vh-9} width={vw-2} height="4" fill={c.shadow}/>}
    <text x={vw/2} y={vh-1} textAnchor="middle" fontSize="4.5" fill={c.pull} fontFamily="monospace">{w}"</text>
  </svg>);}

function DiagCornerIcon({ w=24, h=30, c=DEF }) {
  const vw=sw(w,34,62,1.9); const vh=Math.max(30,Math.min(h,54));
  return (<svg viewBox={`0 0 ${vw} ${vh+5}`} width={vw} height={vh+5}>
    <path d={`M1 1 L${vw-1} 1 L${vw-1} ${vh*0.58} L${vw*0.58} ${vh} L1 ${vh} Z`} fill={c.body} stroke={c.border} strokeWidth="1.2"/>
    <path d={`M1 1 L${vw-1} 1 L${vw-1} 5 L1 5 Z`} fill={c.shadow}/>
    <path d={`M4 8 L${vw-4} 8 L${vw-4} ${vh*0.54} L${vw*0.54} ${vh-4} L4 ${vh-4} Z`} fill={c.door} stroke={c.border} strokeWidth="0.8"/>
    <rect x={vw/2-3} y={vh/2} width="6" height="2" rx="1" fill={c.pull}/>
    <text x={vw*0.4} y={vh+4} textAnchor="middle" fontSize="4.5" fill={c.pull} fontFamily="monospace">{w}×{h}</text>
  </svg>);}

function MicrowaveIcon({ w=27, h=36, c=DEF }) {
  const vw=sw(w,30,62,1.7); const vh=Math.max(28,Math.min(h*0.85,50));
  return (<svg viewBox={`0 0 ${vw} ${vh+5}`} width={vw} height={vh+5}>
    <rect x="1" y="1" width={vw-2} height={vh} rx="2" fill={c.body} stroke={c.border} strokeWidth="1.2"/>
    <rect x="1" y="1" width={vw-2} height="4" rx="2" fill={c.shadow}/>
    <rect x="4" y="7" width={vw*0.63} height={vh-9} rx="1.5" fill={c.door} stroke={c.border} strokeWidth="0.8"/>
    <rect x="6" y="9" width={vw*0.53} height={vh-15} rx="1" fill="#D6EEF8" opacity="0.5"/>
    <rect x={vw*0.70} y="7" width={vw*0.24} height={vh-9} rx="1" fill={c.shadow}/>
    {[0,1,2,3].map(i=><rect key={i} x={vw*0.72} y={10+i*6} width={vw*0.2} height="4" rx="0.5" fill={c.pull} opacity="0.4"/>)}
    <text x={vw/2} y={vh+4} textAnchor="middle" fontSize="4.5" fill={c.pull} fontFamily="monospace">{w}×{h}</text>
  </svg>);}

function WineRackIcon({ w=30, c=DEF }) {
  const vw=sw(w,30,62,1.8); const vh=50;
  return (<svg viewBox={`0 0 ${vw} ${vh}`} width={vw} height={vh}>
    <rect x="1" y="1" width={vw-2} height={vh-6} rx="2" fill={c.body} stroke={c.border} strokeWidth="1.2"/>
    <rect x="1" y="1" width={vw-2} height="4" rx="2" fill={c.shadow}/>
    {[0,1,2].map(row=>[0,1].map(col=>(
      <ellipse key={`${row}-${col}`} cx={8+col*(vw/2-4)} cy={12+row*10} rx="5" ry="3.5" fill={c.door} stroke={c.border} strokeWidth="0.6"/>
    )))}
    <text x={vw/2} y={vh-1} textAnchor="middle" fontSize="4.5" fill={c.pull} fontFamily="monospace">{w}"</text>
  </svg>);}

function MirrorIcon({ w=24, h=30, c=DEF }) {
  const vw=sw(w,26,54,1.6); const vh=Math.max(26,Math.min(h,50));
  return (<svg viewBox={`0 0 ${vw} ${vh+5}`} width={vw} height={vh+5}>
    <rect x="1" y="1" width={vw-2} height={vh} rx="3" fill="#D6EEF8" stroke={c.border} strokeWidth="1.5"/>
    <path d={`M5 5 L${vw*0.35} 5 L${vw*0.25} ${vh*0.35} Z`} fill="white" opacity="0.45"/>
    <rect x="3" y="3" width={vw-6} height={vh-6} rx="2" fill="none" stroke="white" strokeWidth="0.6" opacity="0.3"/>
    <text x={vw/2} y={vh+4} textAnchor="middle" fontSize="4.5" fill={c.pull} fontFamily="monospace">{w}×{h}</text>
  </svg>);}

function SpiceIcon({ c=DEF }) {
  const vw=30, vh=62;
  return (<svg viewBox={`0 0 ${vw} ${vh}`} width={vw} height={vh}>
    <rect x="1" y="1" width={vw-2} height={vh-8} rx="2" fill={c.body} stroke={c.border} strokeWidth="1.2"/>
    <rect x="1" y="1" width={vw-2} height="5" rx="2" fill={c.shadow}/>
    {[0,1,2,3,4].map(i=>(
      <g key={i}>
        <rect x="4" y={9+i*9} width={vw-8} height="7" rx="1" fill={c.door} stroke={c.border} strokeWidth="0.6"/>
        <rect x={vw/2-3} y={9+i*9+2.5} width="6" height="2" rx="1" fill={c.pull}/>
      </g>))}
    <rect x="1" y={vh-9} width={vw-2} height="4" fill={c.shadow}/>
    <text x={vw/2} y={vh-1} textAnchor="middle" fontSize="4.5" fill={c.pull} fontFamily="monospace">SPICE</text>
  </svg>);}

function RollOutIcon({ w=24, c=DEF }) {
  const vw=sw(w,26,54,1.7);
  return (<svg viewBox={`0 0 ${vw} 30`} width={vw} height={30}>
    <rect x="1" y="3" width={vw-2} height="18" rx="2" fill={c.door} stroke={c.border} strokeWidth="1.2"/>
    <rect x="1" y="3" width={vw-2} height="4" rx="2" fill={c.shadow}/>
    <rect x={vw/2-4} y="10" width="8" height="2.5" rx="1" fill={c.pull}/>
    <line x1="0" y1="21" x2={vw} y2="21" stroke={c.border} strokeWidth="1"/>
    <circle cx="6" cy="25" r="2.5" fill={c.shadow} stroke={c.border} strokeWidth="0.7"/>
    <circle cx={vw-6} cy="25" r="2.5" fill={c.shadow} stroke={c.border} strokeWidth="0.7"/>
    <text x={vw/2} y="30" textAnchor="middle" fontSize="4.5" fill={c.pull} fontFamily="monospace">{w}"</text>
  </svg>);}

function AccIcon({ label="ACC", c=DEF }) {
  return (<svg viewBox="0 0 50 28" width={50} height={28}>
    <rect x="1" y="6" width="48" height="16" rx="2" fill={c.body} stroke={c.border} strokeWidth="1.2"/>
    <rect x="1" y="6" width="48" height="4" rx="2" fill={c.shadow}/>
    <text x="25" y="19" textAnchor="middle" fontSize="5.5" fill={c.pull} fontFamily="monospace">{label}</text>
  </svg>);}

function CabinetIcon({ id, description, finish="White" }) {
  const c = FINISH_COLORS[finish] || DEF;
  const t = cabinetType(id, description);
  const w = pw(description), h = ph(description);
  switch(t) {
    case "3drw":    return <DrawerIcon w={w} n={3} c={c}/>;
    case "2drw":    return <DrawerIcon w={w} n={2} c={c}/>;
    case "farm":    return <SinkIcon w={w} c={c} farm/>;
    case "sink":    return <SinkIcon w={w} c={c}/>;
    case "vsink":   return <VanityIcon w={w} c={c} sink/>;
    case "vanity":  return <VanityIcon w={w} c={c} drawers={(description||"").toLowerCase().includes("drawer")}/>;
    case "ls":      return <LazySusanIcon w={w} c={c}/>;
    case "wls":     return <LazySusanIcon w={w} c={c} wall/>;
    case "blind":   return <BlindCornerIcon w={w} c={c}/>;
    case "wblind":  return <BlindCornerIcon w={w} c={c} wall/>;
    case "diag":    return <DiagCornerIcon w={w} h={h} c={c}/>;
    case "micro":   return <MicrowaveIcon w={w} h={h} c={c}/>;
    case "wine":    return <WineRackIcon w={w} c={c}/>;
    case "mirror":  return <MirrorIcon w={w} h={h} c={c}/>;
    case "spice":   return <SpiceIcon c={c}/>;
    case "glassdoor": return <GlassDoorIcon w={w} h={h} c={c}/>;
    case "wall":    return <WallIcon w={w} h={h} c={c}/>;
    case "pantry":  return <PantryIcon w={w} h={h} c={c}/>;
    case "rollout": return <RollOutIcon w={w} c={c}/>;
    case "mold":    return <AccIcon label="MOLD" c={c}/>;
    case "panel":   return <AccIcon label="PANL" c={c}/>;
    case "fill":    return <AccIcon label="FILL" c={c}/>;
    case "toe":     return <AccIcon label="TOE" c={c}/>;
    case "fdoor":   return <AccIcon label="DOOR" c={c}/>;
    case "post":    return <AccIcon label="POST" c={c}/>;
    default:        return <BaseIcon w={w} c={c}/>;
  }
}

const CAT_SHORT = { "All": "All", "Base Cabinets": "Base", "Pantry & Oven Cabinets": "Pantry", "Vanity Cabinets": "Vanity", "Wall Cabinets": "Wall", "Accessories": "Accessories" };

const finishTier = (finish) => {
  if (TIER_ONE_FINISHES.includes(finish)) return "tier1";
  if (TIER_PAINT_FINISHES.includes(finish)) return "paint";
  return "tier2";
};

// ── PRICING CONSTANTS ────────────────────────────────────────────────────────
const MFC_COST_MULT = 0.25;  // your cost = 75% off Modernform retail
const JK_SELL_MULT  = 0.92;  // your sell = 8% below JK NDP

// Get the real NDP (your cost) for a catalog item and finish — applies correct tier multiplier
const getNDP = (item, finish) => {
  if (!item) return null;
  const baseNdp = JK_NDP[item.id] || JK_NDP[item.id?.replace(/^(3|2)DB/, "DB$1-").replace(/^DB(\d+)-(\d)$/, "$2DB$1")];
  if (!baseNdp) return item.tier1 ? Math.round(item.tier1 * 0.25 * 100) / 100 : null;
  const tier = (finish && FINISH_NDP_TIER[finish]) || "t2";
  return Math.round(baseNdp * NDP_TIER_MULT[tier] * 100) / 100;
};

// ── PRICING FUNCTIONS ─────────────────────────────────────────────────────────
// MFC retail (used only for cost calculation)
const getMFCRetail = (item, finish) => {
  if (!item) return 0;
  if (TIER_PAINT_FINISHES.includes(finish)) return Math.round(item.tier1 * PAINT_MULTIPLIER);
  if (finish === "Box Only")     { const b = MFC_BOX[item.id]; return b ? b[0] : item.tier1; }
  if (finish === "Box + Deluxe") { const b = MFC_BOX[item.id]; return b ? b[0] + b[2] : item.tier1; }
  if (TIER_ONE_FINISHES.includes(finish)) return item.tier1;
  return item.tier2;
};

// Your cost = MFC retail × 0.25 (75% off Modernform)
const getCost = (item, finish) => {
  if (!item || TIER_PAINT_FINISHES.includes(finish)) return null;
  return Math.round(getMFCRetail(item, finish) * MFC_COST_MULT * 100) / 100;
};

// Your sell:
//   Standard finishes = JK NDP × 0.92
//   Box finishes = cost × 2.0 (no JK equivalent)
//   Paint grade = MFC retail × 0.55
const getSellPrice = (item, finish) => {
  if (!item) return 0;
  if (TIER_PAINT_FINISHES.includes(finish)) return Math.round(getMFCRetail(item, finish) * 0.55);
  if (TIER_BOX_FINISHES.includes(finish)) {
    const cost = getCost(item, finish);
    return cost ? Math.round(cost * 2.0) : 0;
  }
  const ndp = getNDP(item, finish);
  if (ndp) return Math.round(ndp * JK_SELL_MULT * 100) / 100;
  return Math.round(getMFCRetail(item, finish) * 0.35 * JK_SELL_MULT * 100) / 100;
};

// J&K price = NDP (not applicable for box or paint)
const getJKPrice = (item, finish) => {
  if (!item || TIER_PAINT_FINISHES.includes(finish) || TIER_BOX_FINISHES.includes(finish)) return null;
  return getNDP(item, finish) || null;
};

const getPrice = getMFCRetail;

            d.includes("wall diagonal") || d.includes("wall end") || d.includes("mirror");
        };
        const isLower = (item) => {
          const d = (item.description || "").toLowerCase();
          const i = (item.id || "").toLowerCase();
          return d.includes("base cabinet") || d.includes("sink base") || d.includes("drawer base") ||
            d.includes("lazy susan base") || (d.includes("blind corner") && !d.includes("wall")) ||
            d.includes("vanity") || i.startsWith("b") || i.startsWith("sb") || i.startsWith("vb") ||
            i.startsWith("vdb") || i.startsWith("vsb") || i.startsWith("vsd") || i.startsWith("2db") ||
            i.startsWith("3db") || i.startsWith("bls") || i.startsWith("bbc") || i.startsWith("csb") || i.startsWith("fsm");
        };
        const isTall = (item) => {
          const d = (item.description || "").toLowerCase();
          return d.includes("pantry") || d.includes("oven cabinet") || d.includes("linen");
        };

        // Build per-item rows with classification
        const rows = cabinets.map(item => {
          const widthIn = getWidth(item.description);
          const widthFt = widthIn / 12;
          const unitRetail = item[lftTier];
          const unitCost = unitRetail * MFC_COST_MULT;
          const unitSell = unitRetail * 0.35 * JK_SELL_MULT; // approx NDP×0.92
          const jkUnit = unitRetail * 0.35; // approx NDP
          const type = isTall(item) ? "tall" : isUpper(item) ? "upper" : isLower(item) ? "lower" : "other";
          const costPerFt = widthFt > 0 ? unitCost / widthFt : null;
          const sellPerFt = widthFt > 0 ? unitSell / widthFt : null;
          const jkPerFt   = widthFt > 0 ? jkUnit  / widthFt : null;
          return { ...item, widthIn, widthFt, unitRetail, unitCost, unitSell, jkUnit, type, costPerFt, sellPerFt, jkPerFt };
        }).filter(r => r.widthFt > 0 && r.type !== "other");

        const upperRows = rows.filter(r => r.type === "upper");
        const lowerRows = rows.filter(r => r.type === "lower");
        const tallRows  = rows.filter(r => r.type === "tall");

        // Average $/lft for each group
        const avgPerFt = (arr, key) => {
          if (!arr.length) return 0;
          const valid = arr.filter(r => r[key]);
          return valid.reduce((s, r) => s + r[key], 0) / valid.length;
        };

        // Width buckets: group by cabinet width for easy comparison
        const widthBuckets = [9, 12, 15, 18, 21, 24, 27, 30, 33, 36, 42];

        const getBucketRows = (arr, w) => arr.filter(r => r.widthIn === w);

        const sectionColor = { upper: "#4A6B8A", lower: "#8B7355", tall: "#4a7c59" };
        const sectionBg    = { upper: "#EEF4F9", lower: "#F5F2ED", tall: "#EFF7F2" };
        const sectionLabel = { upper: "UPPER / WALL", lower: "LOWER / BASE", tall: "TALL / PANTRY" };

        const fmtF = (n) => n == null ? "—" : "$" + n.toFixed(0);
        const fmtD = (n) => n == null ? "—" : "$" + n.toFixed(2);

        return (
          <div style={{ padding: "16px 14px 32px" }}>
            {/* Finish selector */}
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontSize: 10, letterSpacing: 2, opacity: 0.4, marginBottom: 8 }}>FINISH FOR REPORT</div>

            </div>

            {/* Summary averages */}
            <div style={{ background: "#1a1a1a", color: "#F5F2ED", borderRadius: 14, padding: "18px", marginBottom: 16 }}>
              <div style={{ fontSize: 10, letterSpacing: 2, opacity: 0.4, marginBottom: 14 }}>AVERAGE $/LINEAR FOOT — {lftFinish.toUpperCase()}</div>
              {[
                { label: "Upper Cabinets", key: "upper", rows: upperRows },
                { label: "Lower / Base Cabinets", key: "lower", rows: lowerRows },
                { label: "Tall / Pantry", key: "tall", rows: tallRows },
              ].map(({ label, key, rows: r }) => (
                <div key={key} style={{ marginBottom: 14 }}>
                  <div style={{ fontSize: 10, opacity: 0.4, letterSpacing: 1, marginBottom: 8 }}>{label.toUpperCase()}</div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <div style={{ flex: 1, background: "#2a2a2a", borderRadius: 8, padding: "10px 12px" }}>
                      <div style={{ fontSize: 8, color: "#4a7c59", letterSpacing: 1, marginBottom: 4 }}>YOUR COST (NDP)</div>
                      <div style={{ fontSize: 18, fontWeight: 700, color: "#4a7c59" }}>{fmtF(avgPerFt(r, "costPerFt"))}<span style={{ fontSize: 10, opacity: 0.5 }}>/ft</span></div>
                    </div>
                    <div style={{ flex: 1, background: "#2a2a2a", borderRadius: 8, padding: "10px 12px" }}>
                      <div style={{ fontSize: 8, color: "#C4956A", letterSpacing: 1, marginBottom: 4 }}>SELL PRICE</div>
                      <div style={{ fontSize: 18, fontWeight: 700, color: "#C4956A" }}>{fmtF(avgPerFt(r, "sellPerFt"))}<span style={{ fontSize: 10, opacity: 0.5 }}>/ft</span></div>
                    </div>
                    <div style={{ flex: 1, background: "#2a2a2a", borderRadius: 8, padding: "10px 12px" }}>
                      <div style={{ fontSize: 8, color: "#8B5E3C", letterSpacing: 1, marginBottom: 4 }}>J&K EST.</div>
                      <div style={{ fontSize: 18, fontWeight: 700, color: "#8B5E3C" }}>{fmtF(avgPerFt(r, "jkPerFt"))}<span style={{ fontSize: 10, opacity: 0.5 }}>/ft</span></div>
                    </div>
                  </div>
                </div>
              ))}
            </div>

            {/* Per-width breakdown */}
            {[
              { key: "upper", rows: upperRows },
              { key: "lower", rows: lowerRows },
              { key: "tall",  rows: tallRows  },
            ].map(({ key, rows: sectionRows }) => (
              <div key={key} style={{ marginBottom: 16 }}>

                  <div style={{ fontSize: 9, letterSpacing: 1.5, opacity: 0.4 }}>CABINET</div>
                  <div style={{ fontSize: 9, letterSpacing: 1, opacity: 0.4, textAlign: "center" }}>WIDTH</div>
                  <div style={{ fontSize: 9, letterSpacing: 1, color: "#4a7c59", textAlign: "right" }}>COST/FT</div>
                  <div style={{ fontSize: 9, letterSpacing: 1, color: "#C4956A", textAlign: "right" }}>SELL/FT</div>

                <div style={{ border: `1px solid ${sectionColor[key]}22`, borderTop: "none", borderRadius: "0 0 10px 10px", overflow: "hidden", background: "#fff" }}>
                  {sectionRows.map((item, i) => (
